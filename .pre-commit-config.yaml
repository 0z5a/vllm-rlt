repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: CPU regression tests
        entry: env OMP_NUM_THREADS=1 python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
